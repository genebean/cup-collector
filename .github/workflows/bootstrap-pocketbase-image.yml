name: Bootstrap PocketBase image

on:
  push:
    branches:
      - container/pocketbase-image

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build and publish bootstrap tag
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/pocketbase
        run: |
          docker build --pull \
            --build-arg PB_VERSION=0.39.11 \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --tag "${IMAGE}:0.39.11-r1" \
            --file pocketbase-image/Dockerfile \
            .
          docker push "${IMAGE}:0.39.11-r1"
